name: CI (SaaS, manual only)

on:
  # This fork depends on Basecamp's private queenbee-plugin for SaaS tests.
  # Keep this workflow manual unless valid private repo credentials are available.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test_oss:
    name: Test (OSS)
    uses: ./.github/workflows/test.yml
    with:
      saas: false
  test_saas:
    name: Test (SaaS)
    uses: ./.github/workflows/test.yml
    with:
      saas: true
    secrets:
      FIZZY_GH_TOKEN: ${{ secrets.FIZZY_GH_TOKEN }}
